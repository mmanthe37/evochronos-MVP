[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "evochronos"
version = "0.1.0"
authors = [
  { name="EvoChronos Research Team", email="core@evochronos.org" },
]
description = "EvoChronos Scientific Python SDK: Multi-Scale Evolutionary Simulation & Invariant Ledger"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]
genomics = ["tskit>=0.5.0", "networkx>=2.8"]
