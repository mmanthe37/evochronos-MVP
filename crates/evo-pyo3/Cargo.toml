[package]
name = "evo-pyo3"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "evochronos_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
evo-core = { path = "../evo-core" }
evo-server = { path = "../evo-server" }
evo-storage = { path = "../evo-storage" }
evo-bridge = { path = "../evo-bridge" }
evo-regime-prebiotic = { path = "../evo-regime-prebiotic" }
evo-regime-protocell = { path = "../evo-regime-protocell" }
evo-regime-prokaryote = { path = "../evo-regime-prokaryote" }
evo-regime-eukaryote = { path = "../evo-regime-eukaryote" }
evo-regime-multicell = { path = "../evo-regime-multicell" }
evo-regime-macro = { path = "../evo-regime-macro" }
serde = { workspace = true }
serde_json = { workspace = true }
