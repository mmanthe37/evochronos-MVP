[package]
name = "evochronos-desktop"
version = "0.1.0"
description = "EvoChronos Evolutionary Sandbox Native Desktop Workstation"
authors = ["EvoChronos Core Research Team"]
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
evo-core = { path = "../../../crates/evo-core" }
evo-storage = { path = "../../../crates/evo-storage" }
evo-server = { path = "../../../crates/evo-server" }
