[workspace]
resolver = "2"
members = [
    "crates/evo-core",
    "crates/evo-regime-prebiotic",
    "crates/evo-regime-protocell",
    "crates/evo-gpu",
    "crates/evo-regime-prokaryote",
    "crates/evo-regime-eukaryote",
    "crates/evo-regime-multicell",
    "crates/evo-regime-macro",
    "crates/evo-bridge",
    "crates/evo-storage",
    "crates/evo-server",
    "crates/evo-pyo3",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["EvoChronos Core Research Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/evochronos/evochronos"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
rand = "0.8"
rand_core = "0.6"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
bytemuck = { version = "1.18", features = ["derive"] }
wgpu = "22.0"
pollster = "0.3"
log = "0.4"
env_logger = "0.11"
